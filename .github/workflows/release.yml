name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.repository == 'tetriz-ai/ghattach'
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "no CHANGELOG.md entry for $GITHUB_REF_NAME"; exit 1; }
      - name: Require a new or draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          response="$RUNNER_TEMP/existing-release.response"
          tag=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
          result=0
          gh api --include "repos/$GH_REPO/releases/tags/$tag" > "$response" 2> "$RUNNER_TEMP/release-preflight.err" || result=$?
          status=$(awk 'NR == 1 { gsub(/\r/, ""); print $2 }' "$response")
          case "$status:$result" in
            404:1) ;;
            200:0)
              if ! awk 'body { print } /^\r?$/ { body=1 }' "$response" | jq -e '.draft == true' > /dev/null; then
                echo "::error::Refusing to upload archives to an existing published release. Use a new release tag."
                exit 1
              fi
              ;;
            *)
              echo "::error::Cannot verify release draft status; refusing to upload archives."
              exit 1
              ;;
          esac
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --draft --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt
      - name: Publish attested release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
