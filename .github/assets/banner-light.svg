<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="ghattach: upload local files to GitHub's user-attachments CDN and print the embed link">
  <rect width="880" height="200" rx="16" fill="#F5F3EE"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="48" y="42" fill="#65736C">$ ghattach upload shot.png --repo OWNER/REPO --markdown</text>
    <rect x="44" y="53" width="566" height="24" rx="4" fill="#1B2A24"/>
    <text x="52" y="70" fill="#F5F3EE">![shot.png](https://github.com/user-attachments/assets/…)</text>
  </g>
  <text x="48" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#1B2A24">ghattach</text>
  <text x="48" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#33453D">Upload local files to GitHub&#39;s user-attachments CDN and print the embed link.</text>
</svg>
